name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: pnpm test
      - run: pnpm run build
      - run: python scripts/check-performance.py assets/documents/Yiqing_Tu_Performance.xlsx index.html
      - name: Save regenerated static website
        run: |
          git add index.html dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate Performance from original Excel'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
